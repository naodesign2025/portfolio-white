<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お問い合わせ | NAO | 大阪浪速区のフリーランス Web エンジニア・ホームページ制作・システム開発</title>
  <meta name="description" content="大阪浪速区のフリーランス Web エンジニア・デザイナー NAO へのお問い合わせページ。ホームページ制作・システム開発のご依頼・ご相談はこちらからお気軽にどうぞ。">
  <meta name="keywords" content="大阪浪速区,システム開発,ホームページ制作,フリーランス,Webエンジニア,Webデザイン,お問い合わせ">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    .contact {
      background: var(--white);
    }

    .contact__inner {
      max-width: 640px;
    }

    .contact__lead {
      font-size: 1rem;
      line-height: 1.9;
      color: var(--text-secondary);
      margin-bottom: 56px;
    }

    .form__group {
      margin-bottom: 32px;
    }

    .form__label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--dark-gray);
      margin-bottom: 10px;
    }

    .form__label span {
      color: var(--color);
      margin-left: 2px;
    }

    .form__input,
    .form__textarea {
      width: 100%;
      background: var(--off-white);
      border: 1px solid var(--light-gray);
      border-radius: var(--radius);
      padding: 14px 16px;
      font-family: var(--font-body);
      font-size: 0.9375rem;
      color: var(--text-primary);
      transition: border-color var(--transition), background var(--transition);
      outline: none;
      -webkit-appearance: none;
    }

    .form__input:focus,
    .form__textarea:focus {
      border-color: var(--color);
      background: var(--white);
    }

    .form__input--error,
    .form__textarea--error {
      border-color: #e05252 !important;
      background: #fff8f8 !important;
    }

    .form__textarea {
      resize: vertical;
      min-height: 180px;
      line-height: 1.7;
    }

    .form__error-msg {
      display: none;
      font-size: 0.75rem;
      color: #e05252;
      margin-top: 6px;
      letter-spacing: 0.02em;
    }

    .form__error-msg.visible {
      display: block;
    }

    .form__alert {
      display: none;
      padding: 14px 18px;
      border-radius: var(--radius);
      font-size: 0.875rem;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .form__alert.visible {
      display: block;
    }

    .form__alert--error {
      background: #fff2f2;
      border: 1px solid #f5c6c6;
      color: #c0392b;
    }

    .form__alert--success {
      background: #f0faf4;
      border: 1px solid #b2dfcc;
      color: #1e7a4a;
    }

    .form__alert--rate-limit {
      background: #fffbf0;
      border: 1px solid #f5e4a0;
      color: #7d6608;
    }

    .form__button {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: var(--text-primary);
      color: var(--white);
      font-family: var(--font-body);
      font-size: 0.8125rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border: none;
      border-radius: var(--radius);
      padding: 16px 36px;
      cursor: pointer;
      transition: background var(--transition), transform var(--transition), opacity var(--transition);
    }

    .form__button:hover:not(:disabled) {
      background: var(--color);
      transform: translateY(-2px);
    }

    .form__button:active:not(:disabled) {
      transform: translateY(0);
    }

    .form__button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .form__button--loading .btn-text {
      display: none;
    }

    .form__button--loading .btn-loading {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-loading {
      display: none;
    }

    .btn-spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: var(--white);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .char-counter {
      font-size: 0.6875rem;
      color: var(--mid-gray);
      text-align: right;
      margin-top: 4px;
      letter-spacing: 0.02em;
    }

    .char-counter.warn {
      color: #e05252;
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <nav class="nav">
    <div class="nav__inner">
      <a href="index.html" class="nav__logo">
        <img src="images/trimknob.png" alt="" class="nav__logo-img">
        TRIM engineerings
      </a>
      <ul class="nav__links">
        <li><a href="index.html#profile">Profile</a></li>
        <li><a href="index.html#skills">Skills</a></li>
        <li><a href="index.html#works">Works</a></li>
        <li><a href="contact.html" style="color: var(--color);">Contact</a></li>
      </ul>
      <button class="nav__hamburger" aria-label="menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <!-- Mobile Menu -->
  <div class="mobile-menu">
    <ul>
      <li><a href="index.html#profile">Profile</a></li>
      <li><a href="index.html#skills">Skills</a></li>
      <li><a href="index.html#works">Works</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </div>

  <!-- Contact -->
  <section class="section contact" style="padding-top: calc(var(--section-pad) + 72px);">
    <div class="container">
      <div class="section__header">
        <span class="section__num">04</span>
        <h2 class="section__title">Contact</h2>
      </div>
      <div class="contact__inner">
        <p class="contact__lead">お仕事のご依頼・ご相談はこちらからお気軽にどうぞ。<br>通常 2〜3 営業日以内にご返信いたします。</p>

        <!-- アラート（rate limit / 送信エラー / 送信成功） -->
        <div id="form-alert" class="form__alert" role="alert" aria-live="polite"></div>

        <form id="contact-form" novalidate>

          <div class="form__group">
            <label class="form__label" for="name">お名前<span>*</span></label>
            <input
              class="form__input"
              type="text"
              id="name"
              name="name"
              placeholder="山田 太郎"
              maxlength="100"
              autocomplete="name"
            >
            <p class="form__error-msg" id="name-error" role="alert"></p>
          </div>

          <div class="form__group">
            <label class="form__label" for="email">メールアドレス<span>*</span></label>
            <input
              class="form__input"
              type="email"
              id="email"
              name="email"
              placeholder="example@email.com"
              maxlength="254"
              autocomplete="email"
            >
            <p class="form__error-msg" id="email-error" role="alert"></p>
          </div>

          <div class="form__group">
            <label class="form__label" for="message">お問い合わせ内容<span>*</span></label>
            <textarea
              class="form__textarea"
              id="message"
              name="message"
              placeholder="ご依頼内容やご質問をご記入ください。"
              maxlength="5000"
            ></textarea>
            <div class="char-counter" id="char-counter">0 / 5000</div>
            <p class="form__error-msg" id="message-error" role="alert"></p>
          </div>

          <button class="form__button" type="submit" id="submit-btn">
            <span class="btn-text">送信する →</span>
            <span class="btn-loading">
              <span class="btn-spinner"></span>
              送信中...
            </span>
          </button>

        </form>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <p class="footer__logo">TRIM</p>
      <p class="footer__copy">&copy; 2026 NAO. All rights reserved.</p>
    </div>
  </footer>

  <script src="script.js"></script>
  <script src="contact-form.js"></script>
</body>
</html>
